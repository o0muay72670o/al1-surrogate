[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "al1-surrogate"
version = "0.1.0"
description = "Surrogate model for AL1 potential"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  - family-names: "Songsamphant"
    given-names: "Poomrapee"
  - family-names: "Ohno"
    given-names: "Shuhei"
    orcid: "https://orcid.org/0009-0001-5222-9726"
]
license = {text = "MIT"}
keywords = ["machine-learning", "surrogate-model", "potential"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "flake8>=4.0",
    "isort>=5.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Repository = "https://github.com/o0muay72670o/al1-surrogate"
Issues = "https://github.com/o0muay72670o/al1-surrogate/issues"

[tool.setuptools]
packages = ["al1_surrogate"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py10", "py11"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=al1_surrogate --cov-report=html --cov-report=term"

[tool.coverage.run]
source = ["al1_surrogate"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
